<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หน้าแนะนำตัว | นาย ภคพล พฤกษ์เพิ่มพูล</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Tahoma", sans-serif;
    background: linear-gradient(135deg, #eaf7ff, #fdf6ff);
    color: #52677a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.card {
    background: rgba(255, 255, 255, 0.9);
    width: 100%;
    max-width: 520px;
    padding: 45px 30px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(150, 180, 200, 0.18);
    border: 1px solid #ffffff;
}

/* วงกลมตกแต่ง */
.icon {
    width: 85px;
    height: 85px;
    margin: 0 auto 20px;
    background: #dff3ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
}

h1 {
    color: #49677d;
    font-size: 28px;
    margin-bottom: 18px;
    line-height: 1.5;
}

.name {
    color: #6b9fc0;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}

p {
    font-size: 16px;
    line-height: 1.9;
    margin-bottom: 8px;
}

.highlight {
    color: #6b9fc0;
    font-weight: bold;
}

.btn {
    display: inline-block;
    background: #a9d8ee;
    color: #ffffff;
    padding: 13px 28px;
    text-decoration: none;
    border-radius: 30px;
    margin-top: 22px;
    font-size: 16px;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(150, 190, 220, 0.25);
}

.btn:hover {
    background: #8fc7e2;
    transform: translateY(-3px);
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #a0b5c2;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">🙋🏻‍♂️</div>

    <h1>ยินดีต้อนรับสู่<br>โปรไฟล์ของผม</h1>

    <p class="name">
        นาย ภคพล พฤกษ์เพิ่มพูล
    </p>

    <p>
        ขณะนี้กำลังศึกษาอยู่ชั้น
        <span class="highlight">มัธยมศึกษาปีที่ 6</span>
    </p>

    <p>
        แผนการเรียน
        <span class="highlight">เตรียมวิศวกรรมศาสตร์</span>
    </p>

    <!-- ปุ่มเข้าสู่ Portfolio -->
    <a href="portfolio.html" class="btn">
        📁 ดูแฟ้มสะสมผลงานของผม
    </a>

    <div class="footer">
        Welcome to my portfolio ✨
    </div>

</div>

</body>
</html>
